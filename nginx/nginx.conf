# Docker's DNS returns one address per API container. `resolve` makes nginx re-check it every
# 5 s, so `docker compose up --scale api=N` needs no nginx restart. Requests are round-robin.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
}

upstream ui {
    zone ui 64k;
    server ui:8501 resolve;
}

server {
    listen 80;
    client_max_body_size 12m;

    # API: /api/predict -> api:8000/predict
    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Streamlit UI (needs websockets)
    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
