[project]
name = "ml-pipeline-summative"
version = "0.1.0"
description = "Machine Learning Cycle"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.9",
    "fastapi[standard]>=0.165.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.9",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "tensorflow-cpu>=2.21.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "locust>=2.47.0",
    "matplotlib>=3.11.2",
    "opencv-python-headless>=5.1.0.95",
    "seaborn>=0.13.2",
]
